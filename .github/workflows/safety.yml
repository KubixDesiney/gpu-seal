name: safety

# CHARTER.md §16 — these tests gate every merge. A change that cannot pass
# them is not merged, regardless of what else it does.
#
# The second job is the one that matters: it proves the safety suite goes red
# when the policy is violated. A green suite that cannot fail is decoration.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-syntax:
    name: shell syntax and line endings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Parse every shell script with bash
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t scripts < <(find . -type f -name '*.sh' -not -path './.git/*' -print | sort)
          test "${#scripts[@]}" -gt 0
          for script in "${scripts[@]}"; do
            echo "bash -n $script"
            bash -n "$script"
            if LC_ALL=C grep -n $'\r' "$script"; then
              echo "CRLF found in $script"
              exit 1
            fi
          done

  safety-tests:
    name: safety suite (§16 tests 1-17)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Safety suite
        run: pytest tests/safety -v --tb=short

      - name: Full suite
        run: pytest tests -q

  suite-negative-control:
    name: prove the suite can go red (${{ matrix.batch.id }})
    runs-on: ubuntu-latest
    # Split across jobs: each mutation reinstalls and reruns tests/safety, so
    # 20 cases serially takes a couple of minutes. Batches run in parallel.
    #
    # Each entry's `id` is only a stable, filename-safe label for this job's
    # log artifact (see mutation-summary below) — it plays no part in case
    # selection. `pattern` is the CASE_FILTER regex, unchanged from before.
    # negative-control-coverage (below) fails CI if any run_case in
    # lab/verify-safety-suite.sh matches none of these patterns.
    strategy:
      fail-fast: false
      matrix:
        batch:
          - id: 01-print-decode-regex-credential-escape
            pattern: 'print\(\) added|decode|regex|credential|escape|offensively'
          - id: 02-repr-pickling-canary-mac-field
            pattern: "repr|pickling|canary MAC|unlisted field"
          - id: 03-safety-stop-publication-signature
            pattern: "safety stop|publication gate on sensitive|same-model die-separation|signature"
          - id: 04-entropy-shared-infra-simulated-ascii
            pattern: "entropy|shared_infrastructure|simulated-result|ascii_metadata"
          - id: 05-measurement-path
            pattern: "measurement-path|measurement_path default"
          - id: 06-probe-identity-measurement-path-decl
            pattern: "probe identity|measurement_path declaration"
          - id: 07-provider-ownership-duration-gpu
            pattern: "prohibited provider|unreviewed provider|ownership confirmation|duration ceiling|duration constant|stable GPU|run budget"
          - id: 08-never-published-publication-attestation
            pattern: "never-published identifier|publication gate narrowed|attestation reduced"
          - id: 09-disclosure-same-model-mig-canary-search
            pattern: "disclosure step|same-model gate|MIG probe|canary search scores"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Inject known policy violations and require detection
        env:
          CASE_FILTER: ${{ matrix.batch.pattern }}
          PYTHON_BIN: python
        run: |
          set -o pipefail
          bash lab/verify-safety-suite.sh 2>&1 | tee "mutation-battery-${{ matrix.batch.id }}.log"

      # Always uploaded, including when the step above failed (a real MISSED
      # case) — mutation-summary needs every shard's output to report which
      # case failed, not just the ones that passed.
      - name: Upload this shard's battery log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-battery-log-${{ matrix.batch.id }}
          path: mutation-battery-${{ matrix.batch.id }}.log
          retention-days: 14

  negative-control-coverage:
    name: every mutation is in a batch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Guards against a mutation being added to the battery but never run
      # because no batch pattern matches it, and against a safety test file
      # with no mutation case at all — either would silently reduce coverage
      # while every other job stayed green.
      - name: Assert every mutation case is covered
        run: python lab/check-mutation-coverage.py

  mutation-summary:
    name: mutation battery summary
    needs: [suite-negative-control]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Download every shard's battery log
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutation-battery-log-*
          path: mutation-logs
          merge-multiple: true

      # Machine-readable record of exactly which of the 38 injected policy
      # violations were caught this run: total, caught, missed, and each
      # case's name and expected failing test. README.md's badge and its
      # "Prove the tests can fail" section are generated from this, not typed
      # by hand — see lab/render-badge.py and the publish-mutation-badge job.
      - name: Build the machine-readable summary
        run: python lab/summarize-mutation-results.py mutation-logs mutation-battery-summary.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-battery-summary
          path: mutation-battery-summary.json
          retention-days: 90

  publish-mutation-badge:
    name: publish mutation battery badge
    needs: [mutation-summary]
    # Only main's own history is authoritative for the committed badge; a PR
    # run still gets a mutation-battery-summary artifact (uploaded above) but
    # must not push to main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mutation-battery-summary
          path: .

      - name: Render the badge from the summary
        run: python lab/render-badge.py mutation-battery-summary.json badges/mutation-battery.svg

      # No-op unless the caught/total count actually changed, so a green run
      # doesn't produce an empty commit every push to main. [skip ci] stops
      # this commit from re-triggering the workflow on itself.
      - name: Commit the badge if it changed
        run: |
          set -euo pipefail
          if git diff --quiet -- badges/mutation-battery.svg; then
            echo "badge unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/mutation-battery.svg
          git commit -m "chore: update mutation battery badge [skip ci]"
          git push origin HEAD:main

  lint:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check probe tests

      - name: Mypy
        run: mypy --no-incremental

      - name: Documentation links and onboarding invariants
        run: python lab/check-docs.py

      - name: GitHub Action commit pin policy
        run: python lab/check-github-actions.py

  python-coverage:
    name: Python line and branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Full suite with line and branch coverage
        run: |
          python -m pytest tests -q --cov=probe/gpu_seal --cov-branch \
            --cov-report=term-missing --cov-report=json:coverage.json
           python lab/check-coverage.py coverage.json --min-line 80 --min-branch 77

  wheel-install:
    name: non-editable wheel installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build and exercise a clean installed wheel
        run: python lab/test-installed-wheel.py

  dashboard-install:
    name: dashboard install
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci

  dashboard-audit:
    name: dashboard dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit --audit-level=high

  dashboard-lint:
    name: dashboard lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint

  dashboard-typecheck:
    name: dashboard typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  dashboard-build:
    name: dashboard production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  dashboard-production-smoke:
    name: dashboard production asset smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:production

  dashboard-browser:
    name: dashboard production browser verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  native-container:
    name: native conformance container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build release container and run native conformance
        run: |
          docker build \
            --file infrastructure/containers/Dockerfile \
            --tag gpu-seal-native-conformance \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg BUILD_TIMESTAMP="${SOURCE_DATE_EPOCH:-0}" \
            .

  portability-windows:
    name: Windows harness portability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Exercise configured interpreter and shell resolution
        shell: bash
        run: |
          set -euo pipefail
          PYTHON_BIN="$(command -v python)" bash lab/verify-safety-suite.sh
      - name: Run Windows portability tests
        run: python -m pytest tests/unit/test_safety_harness.py tests/unit/test_scorecard.py -q

  release-readiness:
    name: release readiness (advisory until v0.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install build tooling for artifacts
        run: pip install build setuptools wheel

      - name: Build Python wheel
        run: python -m build --wheel --no-isolation --outdir dist-wheel

      - name: Build dashboard production artifact
        run: |
          npm ci
          npm run build
        working-directory: dashboard

      # Reports what blocks a public release: author metadata, the lock file,
      # the provider policy matrix, quarantine hygiene, pre-registration.
      #
      # Advisory on every ordinary push, because "no provider reviewed yet" is
      # the correct Phase 0 state and turning it into a red build teaches
      # people to ignore red builds. Blocking on a tag, because that is the
      # moment the answers actually have to be yes.
      - name: Check
        id: readiness
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          wheel="$(find dist-wheel -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python lab/check-release-readiness.py \
            --wheel "$wheel" \
            --dashboard-dist dashboard/dist/client

  no-cloud-testing-marker:
    name: Phase 0 gate - no provider testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # CHARTER.md §23: "Do not begin named-provider testing until the ethics
      # and policy checklist is complete." lab/check-provider-policy.py is the
      # same check the controller applies at runtime, and is printed here for
      # visibility. It is informational only in this job now — see below for
      # why it used to gate the real check and no longer does.
      - name: Check the provider policy matrix
        run: python lab/check-provider-policy.py

      # This used to run only "if gate == enforced" — i.e. only while no
      # provider had a complete review. That conflated two different
      # questions: "does at least one reviewed record exist" and "is it safe
      # for a real provider name to appear in source." Once provider-a's
      # review completed, the gate lifted globally and this step stopped
      # running at all — for every provider, forever, regardless of whether
      # that specific provider was ever classified full-probe-ok. That is
      # precisely how a real hyperscaler's name reached
      # docs/provider-policy-review and a findings note in cleartext while
      # this job stayed green (REMAINING.md P0.1/P0.2).
      #
      # A provider being reviewed and permitted to run never requires writing
      # its real name anywhere: the controller, probes, and result bundles
      # only ever need the pseudonymous provider_code. So this check now runs
      # unconditionally, on every push, regardless of the matrix's state, and
      # scans the whole tracked tree rather than only probe/ and controller/ —
      # lab/check-release-readiness.py's check_no_named_providers() is the
      # single source of truth for the pattern and the reviewed-file
      # allowlist, so this job can't silently drift out of sync with it.
      - name: Reject real provider names anywhere in the tracked tree
        run: |
          set -euo pipefail
          python -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('release_readiness', 'lab/check-release-readiness.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          check = module.check_no_named_providers()
          for problem in check.problems:
              print(problem)
          sys.exit(0 if check.ok else 1)
          "
