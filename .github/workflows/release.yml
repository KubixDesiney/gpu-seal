name: release

# Fires only on version tags. Everything here re-proves what safety.yml
# already gates on main, then goes further: build the artefacts a human or a
# `pip install` will actually consume, attest to how they were built, and
# publish them. There is no continue-on-error anywhere in this file — a tag
# push is the one moment the answers have to be yes, not advisory.
#
# Trusted Publishing (OIDC) is used for PyPI: no long-lived API token is
# stored in this repository or in GitHub Secrets. See the `publish` job.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: safety and unit suite (release gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Safety suite
        run: pytest tests/safety -v --tb=short

      - name: Full suite
        run: pytest tests -q

      - name: Install build tooling for artifacts
        run: pip install build setuptools wheel

      - name: Build Python wheel for the readiness check
        run: python -m build --wheel --no-isolation --outdir dist-wheel

      - name: Build dashboard production artifact
        run: |
          npm ci
          npm run build
        working-directory: dashboard

      # lab/check-release-readiness.py is the same gate CHARTER.md §21/§23
      # require before any public release: author metadata, lock file,
      # provider policy, quarantine hygiene, pre-registration, wheel
      # contents, dashboard assets, and a clean worktree.
      - name: Release readiness gate
        run: |
          set -euo pipefail
          wheel="$(find dist-wheel -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          python lab/check-release-readiness.py \
            --wheel "$wheel" \
            --dashboard-dist dashboard/dist/client

  build:
    name: build sdist and wheel
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Build sdist and wheel
        run: python -m build --outdir dist

      - name: Generate SHA-256 checksums
        run: |
          set -euo pipefail
          mkdir -p checksums
          (cd dist && sha256sum *.tar.gz *.whl) | tee checksums/SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: checksums
          path: checksums/
          if-no-files-found: error

  sbom:
    name: generate SBOM
    needs: build
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - name: Install cyclonedx-py
        run: pip install cyclonedx-py

      # A fresh venv holding only the built wheel, so the SBOM describes what
      # `pip install gpu-seal` actually pulls in — not this job's own dev
      # tooling (cyclonedx-py itself included).
      - name: Install the built wheel into a clean environment
        run: |
          set -euo pipefail
          python -m venv package-env
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          package-env/bin/pip install --upgrade pip
          package-env/bin/pip install "$wheel"

      - name: Generate CycloneDX SBOM for the installed package
        run: |
          mkdir -p sbom
          cyclonedx-py environment package-env/bin/python \
            --output-format JSON \
            --output-file sbom/gpu-seal.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  provenance:
    name: build provenance attestation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.whl

  publish:
    name: publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gpu-seal
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    name: create GitHub Release
    needs: [build, sbom, provenance, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: checksums
          path: checksums

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sbom
          path: sbom

      - name: Verify release evidence file exists
        run: test -f "release-evidence-${{ github.ref_name }}.txt"

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.whl
            checksums/SHA256SUMS
            sbom/*.cdx.json
            release-evidence-${{ github.ref_name }}.txt
