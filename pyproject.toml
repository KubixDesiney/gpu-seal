[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-seal"
version = "0.1.0a1"
description = "Tenant-Observable Security and Isolation Assurance for GPU Clouds"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["gpu", "cloud", "security", "isolation", "attestation", "measurement"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=42",
  "numpy>=1.24,<3",
  "jsonschema>=4",
]

[project.scripts]
gpu-seal = "gpu_seal.cli:main"

[project.optional-dependencies]
# ruff is upper-bounded deliberately. It was unpinned, and a minor release
# began enforcing PEP 585/604 annotations at target-version py310 — turning a
# required CI job red across every module, including files nobody had touched.
# A lint gate that fails on a dependency upgrade is a gate people learn to
# ignore. Widen the bound when the annotations have been checked against it.
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16,<0.17",
  "types-jsonschema>=4.24",
]

cuda = [
  "cupy-cuda12x>=13",
  # §9.2 (shared-memory sanitisation) and §9.8 (topology fingerprint) compile
  # CUDA kernels at runtime: §9.8 needs `%smid` for physical SM labels, and
  # there is no way to read it without a kernel. CuPy's wheel bundles the
  # runtime libraries but not the compiler or the headers it needs, so
  # `RawKernel` fails with "Failed to find CUDA headers" on an otherwise
  # working install — a GPU that runs §9.3 fine and cannot run §9.8 at all.
  # These three are what close that gap.
  #
  # BARE-METAL ONLY. They are deliberately absent from
  # infrastructure/containers/requirements-lock.txt: the image is built on
  # nvidia/cuda:*-devel-ubuntu22.04, which already ships nvcc, nvrtc, and the
  # headers system-wide. Adding them to the lock file would install a second
  # copy of the toolkit inside an image that has one. Their absence there is a
  # decision, not an oversight.
  "nvidia-cuda-nvrtc-cu12",
  "nvidia-cuda-runtime-cu12",
  "nvidia-cuda-nvcc-cu12",
]

[tool.setuptools]
package-dir = { "" = "probe" }

[tool.setuptools.packages.find]
where = ["probe"]

[tool.setuptools.package-data]
gpu_seal = ["schemas/*.json"]

[tool.pytest.ini_options]
pythonpath = ["probe"]
testpaths = ["tests"]
markers = [
  "safety: CHARTER.md §16 CI safety tests. These gate every merge.",
  "requires_cuda: needs a physical NVIDIA GPU; skipped in CI.",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "UP"]

ignore = [
  # S110 `try/except/pass`. Every occurrence in this repo is a teardown path
  # that must not mask the result being torn down around: freeing a device
  # allocation while an earlier exception propagates, or zeroing a SafeBuffer
  # from __del__. Logging there would either swallow the real error or write
  # driver state into a log the probe is not supposed to produce. Each site
  # already carries a `# noqa: BLE001` and a comment saying so.
  "S110",
]

per-file-ignores = { "tests/**" = [
  # The safety suite asserts deliberately, and several tests evaluate an
  # expression purely to prove it raises.
  "S101",
  "B018",
  "UP031",
], "probe/gpu_seal/safety/buffer.py" = [
  # Type-narrowing assertions immediately after _check_usable(), which does
  # the real raising. Not invariants — the check above them is.
  "S101",
  # False positive: `_caller_token` is a module-name tripwire compared against
  # a literal, not a shared token used to authenticate anything.
  "S105",
] }

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_generics = true
mypy_path = ["stubs"]
files = ["probe/gpu_seal"]
