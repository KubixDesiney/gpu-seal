[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-seal"
version = "0.1.0.dev0"
description = "Tenant-Observable Security and Isolation Assurance for GPU Clouds"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["gpu", "cloud", "security", "isolation", "attestation", "measurement"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
]
dependencies = [
  "cryptography>=42",
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "ruff>=0.5", "mypy>=1.10"]
cuda = ["cupy-cuda12x>=13"]

[tool.setuptools]
package-dir = { "" = "probe" }

[tool.setuptools.packages.find]
where = ["probe"]

[tool.pytest.ini_options]
pythonpath = ["probe"]
testpaths = ["tests"]
markers = [
  "safety: CHARTER.md §16 CI safety tests. These gate every merge.",
  "requires_cuda: needs a physical NVIDIA GPU; skipped in CI.",
]
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "S", "UP"]
# S101 (assert) is fine in tests; the safety suite uses asserts deliberately.
per-file-ignores = { "tests/**" = ["S101"] }

[tool.mypy]
python_version = "3.10"
strict = true
files = ["probe/gpu_seal"]
